<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Iter — Connect, explore, and share with your community worldwide.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Iter">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="icon" type="image/png" href="favicon-32x32.png">

  <!-- Theme Color -->
  <!-- Google Sign-In Web Client ID -->
  <meta name="google-signin-client_id" content="751233585713-cl111fujhkk21jcm3lbddodlb4hlldkq.apps.googleusercontent.com">

  <title>Iter</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #0B0E14;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    #iter-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 45%, #181D2A 0%, #0B0E14 100%);
      z-index: 999999;
      user-select: none;
    }

    .logo-container {
      position: relative;
      width: 104px;
      height: 104px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pulse-glow {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 28px;
      background: rgba(157, 78, 221, 0.35);
      filter: blur(18px);
      animation: pulse 2.4s ease-in-out infinite alternate;
    }

    .logo-img {
      position: relative;
      width: 96px;
      height: 96px;
      border-radius: 24px;
      object-fit: cover;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(157, 78, 221, 0.3);
      animation: float 3s ease-in-out infinite;
    }

    .app-name {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 1.5px;
      background: linear-gradient(135deg, #FFFFFF 30%, #C77DFF 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 30px;
    }

    .loading-track {
      width: 140px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    .loading-bar {
      position: absolute;
      top: 0;
      left: -50%;
      width: 50%;
      height: 100%;
      background: linear-gradient(90deg, #7B2CBF, #C77DFF, #E0AAFF);
      border-radius: 999px;
      animation: indeterminate 1.6s infinite cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes pulse {
      0% {
        transform: scale(0.9);
        opacity: 0.3;
      }
      100% {
        transform: scale(1.2);
        opacity: 0.7;
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-5px);
      }
    }

    @keyframes indeterminate {
      0% {
        left: -50%;
        width: 30%;
      }
      50% {
        left: 30%;
        width: 60%;
      }
      100% {
        left: 100%;
        width: 30%;
      }
    }
  </style>
</head>
<body>
  <!-- Branded Splash Loading Screen -->
  <div id="iter-loader">
    <div class="logo-container">
      <div class="pulse-glow"></div>
      <img src="icons/app_icon.png" alt="Iter Logo" class="logo-img" />
    </div>
    <h1 class="app-name">Iter</h1>
    <div class="loading-track">
      <div class="loading-bar"></div>
    </div>
  </div>

  <script>
    function hideIterLoader() {
      var loader = document.getElementById('iter-loader');
      if (loader && loader.style.display !== 'none') {
        loader.style.opacity = '0';
        loader.style.transition = 'opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1)';
        setTimeout(function () {
          if (loader && loader.parentNode) loader.parentNode.removeChild(loader);
        }, 450);
      }
    }

    // 1. Listen for custom event if dispatched
    window.addEventListener('flutter-first-frame', hideIterLoader);

    // 2. Observe DOM: when Flutter mounts flutter-view, flt-glass-pane, or canvas, dismiss loader
    var observer = new MutationObserver(function (mutations, obs) {
      if (document.querySelector('flutter-view, flt-glass-pane, flt-scene-host, canvas')) {
        setTimeout(hideIterLoader, 200);
        obs.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // 3. Safety fallback: never block the user for more than 3.5 seconds
    setTimeout(hideIterLoader, 3500);

    // 4. Evict stale service workers and cache to guarantee fresh code
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        for (var reg of registrations) {
          reg.unregister();
        }
      });
    }
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
