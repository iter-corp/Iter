name: Development Pipeline

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: development-pipeline
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────
  #  1. Quality & Code Validation
  # ─────────────────────────────────────────────────────────────
  validate:
    name: Validate (Flutter & Hono Backend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'backend-hono/package-lock.json'

      - name: Validate Flutter Project
        run: |
          [ -f .env ] || echo "API_BASE_URL=https://dev.iterglobal.icu/api/v1" > .env
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Validate Hono Backend
        run: |
          cd backend-hono
          npm ci
          npm test

  # ─────────────────────────────────────────────────────────────
  #  2. Hono Backend Deployment (Dev Server via SSH)
  # ─────────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Dev Backend
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SERVER_PORT || '65002' }} -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts || true
          chmod 644 ~/.ssh/known_hosts

      - name: Test SSH Authentication
        run: |
          for i in 1 2 3; do
            echo "Attempt $i: Testing SSH authentication..."
            if ssh -i ~/.ssh/deploy_key -p ${{ secrets.SERVER_PORT || '65002' }} -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=30 ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_HOST }} 'echo "SSH authentication verified: $(whoami)@$(hostname)"'; then
              echo "SSH authentication verified successfully."
              break
            fi
            if [ $i -eq 3 ]; then
              echo "SSH authentication failed after 3 attempts."
              exit 1
            fi
            echo "SSH connection attempt failed. Retrying in 5 seconds..."
            sleep 5
          done

      - name: Sync Backend Files to Dev Server
        run: |
          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude '.env' \
            --exclude 'uploads' \
            --exclude '.git' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SERVER_PORT || '65002' }} -o StrictHostKeyChecking=no" \
            backend-hono/ ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_HOST }}:~/backend-hono-dev/

      - name: Install Dependencies, Migrate & Reload Dev PM2
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SERVER_PORT || '65002' }} -o StrictHostKeyChecking=no -o BatchMode=yes ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_HOST }} '
            export PATH=/usr/local/bin:/usr/bin:/bin:/usr/local/sbin:/usr/sbin:/opt/alt/alt-nodejs22/root/usr/bin:~/.npm-global/bin:$PATH
            cd ~/backend-hono-dev
            npm install
            if [ -f .env ]; then
              sed -i "s/u814384925_iter_dev/u814384925_iter_db_dev/g" .env
              sed -i "s/u814384925_iter_db\b/u814384925_iter_db_dev/g" .env
              sed -i "s/u814384925_iter_user\b/u814384925_iter_user_dev/g" .env
              sed -i "s/DB_NAME=.*/DB_NAME=u814384925_iter_db_dev/g" .env
              sed -i "s/DB_USER=.*/DB_USER=u814384925_iter_user_dev/g" .env
              npm run db:migrate || true
              npm run db:seed || true
            fi
            pm2 reload ecosystem.config.json || pm2 restart ecosystem.config.json || pm2 start ecosystem.config.json
            pm2 save
          '

  # ─────────────────────────────────────────────────────────────
  #  3. Flutter Web Deployment (Dev Domain via SSH)
  # ─────────────────────────────────────────────────────────────
  deploy-web:
    name: Deploy Dev Flutter Web
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Flutter Web Release for Dev
        run: |
          echo "API_BASE_URL=https://dev.iterglobal.icu/api/v1" > .env
          flutter pub get
          flutter build web --release
          cp web/.htaccess build/web/.htaccess || true
          cp web/api-proxy.php build/web/api-proxy.php || true
          echo "3001" > build/web/.backend_port
          BUILD_TAG=$(date +%s)
          sed -i "s/main.dart.js/main.dart.js?v=$BUILD_TAG/g" build/web/flutter_bootstrap.js || true
          sed -i "s/flutter_bootstrap.js/flutter_bootstrap.js?v=$BUILD_TAG/g" build/web/index.html || true

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SERVER_PORT || '65002' }} -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts || true
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy Flutter Web to Dev Web Root
        run: |
          TARGET_DIR="/home/${{ secrets.SERVER_USERNAME }}/domains/iterglobal.icu/public_html/dev"
          echo "Deploying Dev Flutter Web to: $TARGET_DIR"
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SERVER_PORT || '65002' }} -o StrictHostKeyChecking=no ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_HOST }} "mkdir -p $TARGET_DIR"
          rsync -avzc --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SERVER_PORT || '65002' }} -o StrictHostKeyChecking=no" \
            build/web/ ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_HOST }}:$TARGET_DIR/

  # ─────────────────────────────────────────────────────────────
  #  4. Flutter Android Release (Dev Build: APK & AAB)
  # ─────────────────────────────────────────────────────────────
  release-android:
    name: Release Dev Android (APK & AAB)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Android Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 || secrets.PLAY_STORE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Configuring release signing keystore..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            echo "storePassword=$KEYSTORE_PASSWORD" > android/key.properties
            echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
            echo "keyAlias=$KEY_ALIAS" >> android/key.properties
            echo "storeFile=upload-keystore.jks" >> android/key.properties
          else
            echo "No keystore secret provided; relying on existing Gradle signing configuration"
          fi

      - name: Build Android Dev Release (APK & AAB)
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          echo "API_BASE_URL=https://dev.iterglobal.icu/api/v1" > .env
          echo "APP_ENV=dev" >> .env
          BUILD_NUMBER=$(( 1000 + RUN_NUMBER ))
          echo "Building Android Dev (APK & AAB): build number $BUILD_NUMBER"

          # Build standalone installable Dev APK
          flutter build apk --release \
            --build-name=1.1.4-dev \
            --build-number=$BUILD_NUMBER \
            --dart-define=APP_ENV=dev \
            --dart-define=API_BASE_URL=https://dev.iterglobal.icu/api/v1 \
            -PAPP_ENV=dev

          # Build Dev AAB (for Play Store Internal testing if needed)
          flutter build appbundle --release \
            --build-name=1.1.4-dev \
            --build-number=$BUILD_NUMBER \
            --dart-define=APP_ENV=dev \
            --dart-define=API_BASE_URL=https://dev.iterglobal.icu/api/v1 \
            -PAPP_ENV=dev \
            --android-skip-build-dependency-validation

      - name: Upload Dev APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-dev-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload Dev AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-dev-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Check Play Store Credentials
        id: check_play_creds
        env:
          PLAY_CREDS: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT || secrets.PLAY_STORE_JSON_KEY || secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON || secrets.PLAY_CONFIG_JSON || secrets.PLAY_CONSOLE_JSON }}
        run: |
          if [ -n "$PLAY_CREDS" ]; then
            echo "has_creds=true" >> $GITHUB_OUTPUT
          else
            echo "has_creds=false" >> $GITHUB_OUTPUT
            echo "::notice::Google Play credentials not configured. The installable Dev APK has been uploaded to GitHub Artifacts."
          fi

      - name: Upload Dev AAB to Google Play Internal Track
        if: steps.check_play_creds.outputs.has_creds == 'true'
        uses: r0adkll/upload-google-play@v1
        continue-on-error: true
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT || secrets.PLAY_STORE_JSON_KEY || secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON || secrets.PLAY_CONFIG_JSON || secrets.PLAY_CONSOLE_JSON }}
          packageName: com.iter.ai
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

  # ─────────────────────────────────────────────────────────────
  #  5. Flutter iOS Release (Dev Build: TestFlight / IPA)
  # ─────────────────────────────────────────────────────────────
  release-ios:
    name: Release Dev iOS (TestFlight / IPA)
    needs: validate
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Select Latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Install Apple Certificate and Provisioning Profile
        id: apple_auth
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 || secrets.APPLE_CERTIFICATE_BASE64 || secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD || secrets.APPLE_CERTIFICATE_PASSWORD || secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 || secrets.APPLE_PROVISIONING_PROFILE_BASE64 || secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'temporary_runner_keychain_pass' }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID || secrets.APP_STORE_CONNECT_KEY_ID || secrets.ASC_KEY_ID || secrets.APPLE_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID || secrets.APP_STORE_CONNECT_ISSUER_ID || secrets.ASC_ISSUER_ID || secrets.APPLE_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY || secrets.APP_STORE_CONNECT_PRIVATE_KEY || secrets.ASC_PRIVATE_KEY || secrets.APPLE_PRIVATE_KEY }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH || true
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH || true
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH || true
          security default-keychain -s $KEYCHAIN_PATH || true

          if [ -n "$APP_STORE_CONNECT_PRIVATE_KEY" ] && [ -n "$APP_STORE_CONNECT_KEY_ID" ]; then
            echo "Configuring App Store Connect API private key..."
            mkdir -p ~/.appstoreconnect/private_keys ~/.private_keys
            echo "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
            echo "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
            chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8 ~/.private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

            # Synchronize certificates and profiles directly from App Store Connect API for com.iter.ai.dev
            APP_BUNDLE_ID=com.iter.ai.dev node ios/sync_apple_credentials.cjs || true
          fi

          if [ -n "$BUILD_CERTIFICATE_BASE64" ] && [ -n "$BUILD_PROVISION_PROFILE_BASE64" ]; then
            echo "Installing Apple distribution certificate from repository secrets..."
            CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
            PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision

            echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > $CERTIFICATE_PATH
            echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > $PP_PATH

            security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
            security list-keychain -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH || true

            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

            security cms -D -i $PP_PATH > $RUNNER_TEMP/profile.plist 2>/dev/null || true
            if [ -f "$RUNNER_TEMP/profile.plist" ]; then
              PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" $RUNNER_TEMP/profile.plist 2>/dev/null || true)
              PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" $RUNNER_TEMP/profile.plist 2>/dev/null || true)
              TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" $RUNNER_TEMP/profile.plist 2>/dev/null || true)
            fi

            if [ -z "$PROFILE_UUID" ]; then
              PROFILE_UUID=$(strings $PP_PATH | grep -A1 -m1 "<key>UUID</key>" | grep -v "<key>" | sed -e 's/<[^>]*>//g' | tr -d '\t\n\r ')
            fi
            if [ -z "$PROFILE_NAME" ]; then
              PROFILE_NAME=$(strings $PP_PATH | grep -A1 -m1 "<key>Name</key>" | grep -v "<key>" | sed -e 's/<[^>]*>//g' | tr -d '\t\n\r ')
            fi
            if [ -z "$TEAM_ID" ]; then
              TEAM_ID=$(strings $PP_PATH | grep -A2 -m1 "<key>TeamIdentifier</key>" | grep "<string>" | sed -e 's/<[^>]*>//g' | tr -d '\t\n\r ')
            fi

            if [ -n "$PROFILE_UUID" ]; then
              cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/${PROFILE_UUID}.mobileprovision
            fi
            cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

            echo "CODE_SIGN_STYLE = Manual" >> ios/Flutter/Release.xcconfig
            echo "CODE_SIGN_IDENTITY = Apple Distribution" >> ios/Flutter/Release.xcconfig
            echo "CODE_SIGN_IDENTITY[sdk=iphoneos*] = Apple Distribution" >> ios/Flutter/Release.xcconfig
            if [ -n "$PROFILE_NAME" ]; then
              echo "PROVISIONING_PROFILE_SPECIFIER = $PROFILE_NAME" >> ios/Flutter/Release.xcconfig
            fi
            if [ -n "$PROFILE_UUID" ]; then
              echo "PROVISIONING_PROFILE = $PROFILE_UUID" >> ios/Flutter/Release.xcconfig
            fi
            if [ -n "$TEAM_ID" ]; then
              echo "DEVELOPMENT_TEAM = $TEAM_ID" >> ios/Flutter/Release.xcconfig
            fi

            PROFILE_KEY="${PROFILE_NAME:-$PROFILE_UUID}"
            if [ -n "$PROFILE_KEY" ]; then
              /usr/libexec/PlistBuddy -c "Add :signingStyle string manual" ios/ExportOptions.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :signingStyle manual" ios/ExportOptions.plist || true
              /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" ios/ExportOptions.plist 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:com.iter.ai.dev string $PROFILE_KEY" ios/ExportOptions.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:com.iter.ai.dev $PROFILE_KEY" ios/ExportOptions.plist || true
            fi
            if [ -n "$TEAM_ID" ]; then
              /usr/libexec/PlistBuddy -c "Set :teamID $TEAM_ID" ios/ExportOptions.plist 2>/dev/null || true
            fi
          fi

      - name: Disable Swift Package Manager (Use CocoaPods)
        run: flutter config --no-enable-swift-package-manager

      - name: Configure iOS Project for Dev (Bundle ID & Firebase)
        run: |
          if [ -f "ios/Runner/GoogleService-Info-dev.plist" ]; then
            echo "Applying Dev Firebase configuration to GoogleService-Info.plist..."
            cp ios/Runner/GoogleService-Info-dev.plist ios/Runner/GoogleService-Info.plist
          fi
          echo "Setting bundle identifier to com.iter.ai.dev..."
          sed -i '' 's/com.iter.ai;/com.iter.ai.dev;/g' ios/Runner.xcodeproj/project.pbxproj || true
          sed -i '' 's/CFBundleDisplayName = Iter;/CFBundleDisplayName = "Iter Dev";/g' ios/Runner.xcodeproj/project.pbxproj || true

      - name: Build Flutter iOS Release IPA for Dev
        env:
          RUN_NUMBER: ${{ github.run_number }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'temporary_runner_keychain_pass' }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          if [ -f "$KEYCHAIN_PATH" ]; then
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH || true
            security default-keychain -s $KEYCHAIN_PATH || true
          fi

          echo "API_BASE_URL=https://dev.iterglobal.icu/api/v1" > .env
          echo "APP_ENV=dev" >> .env
          BUILD_NUMBER=$(( 1000 + RUN_NUMBER ))
          echo "Building iOS Dev IPA: version 1.1.4-dev, build number $BUILD_NUMBER"
          flutter pub get

          if [ -f "ios/ExportOptions.plist" ]; then
            flutter build ipa --release \
              --build-name=1.1.4 \
              --build-number=$BUILD_NUMBER \
              --dart-define=APP_ENV=dev \
              --dart-define=API_BASE_URL=https://dev.iterglobal.icu/api/v1 \
              --export-options-plist=ios/ExportOptions.plist
          else
            flutter build ipa --release \
              --build-name=1.1.4 \
              --build-number=$BUILD_NUMBER \
              --dart-define=APP_ENV=dev \
              --dart-define=API_BASE_URL=https://dev.iterglobal.icu/api/v1
          fi

      - name: Upload Dev iOS IPA Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-dev-release-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 30

      - name: Upload to App Store Connect / TestFlight
        continue-on-error: true
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID || secrets.APP_STORE_CONNECT_KEY_ID || secrets.ASC_KEY_ID || secrets.APPLE_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID || secrets.APP_STORE_CONNECT_ISSUER_ID || secrets.ASC_ISSUER_ID || secrets.APPLE_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY || secrets.APP_STORE_CONNECT_PRIVATE_KEY || secrets.ASC_PRIVATE_KEY || secrets.APPLE_PRIVATE_KEY }}
        run: |
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "::warning::No generated IPA file found in build/ios/ipa"
            exit 0
          fi
          echo "Found Dev IPA: $IPA_PATH"

          if [ -n "$APP_STORE_CONNECT_PRIVATE_KEY" ] && [ -n "$APP_STORE_CONNECT_KEY_ID" ]; then
            mkdir -p ~/.appstoreconnect/private_keys ~/.private_keys
            echo "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
            echo "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

            echo "Uploading Dev IPA to TestFlight..."
            xcrun altool --upload-app \
              --type ios \
              --file "$IPA_PATH" \
              --apiKey "$APP_STORE_CONNECT_KEY_ID" \
              --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
            echo "Upload to TestFlight complete."
          else
            echo "::notice::App Store Connect API key secrets not configured. The Dev IPA has been saved to workflow artifacts."
          fi

