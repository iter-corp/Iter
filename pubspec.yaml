name: coil
description: Iter — Social community app
publish_to: "none"
version: 2.0.0+3001

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # WebView
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.12.0
  webview_flutter_wkwebview: ^3.25.1

  # Firebase
  firebase_core: ^4.2.0
  firebase_messaging: ^16.0.4

  # Connectivity
  connectivity_plus: ^7.0.0

  # Permissions
  permission_handler: ^11.3.1

  # Media pickers (native camera/gallery bridge)
  image_picker: ^1.0.7
  file_picker: ^8.0.0+1

  # Hardware — BLE & WiFi (App Store Guideline 4.2 pillars)
  flutter_blue_plus: ^2.3.10
  network_info_plus: ^6.1.4

  # Storage
  shared_preferences: ^2.5.5

  # Utilities
  url_launcher: ^6.3.2
  share_plus: ^10.1.2

  # Splash
  flutter_native_splash: ^2.4.7
  # Auth
  google_sign_in: ^6.2.2
  firebase_auth: ^6.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/img/
    - assets/icons/
