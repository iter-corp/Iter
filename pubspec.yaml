name: coil
description: Coil — Social community app
publish_to: "none"
version: 1.1.5+10

environment:
  sdk: ">=3.0.0 <4.0.0"

# ─────────────────────────────────────────────
#  Dependencies
# ─────────────────────────────────────────────
dependencies:
  flutter:
    sdk: flutter

  # Localization — Material/Cupertino localized widgets + RTL support
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  rxdart: ^0.28.0

  # Navigation
  go_router: ^13.2.0

  # Image caching (better than raw Image.network)
  cached_network_image: ^3.3.1
  # Disk cache manager — used to cache post images (large) and to
  # cache post videos to disk so they don't re-stream every view.
  flutter_cache_manager: ^3.3.1

  # Safe area / device info
  flutter_native_splash: ^2.4.0
  flutter_svg: ^2.0.17

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.7.0
  google_sign_in: ^6.2.2
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.4.10
  cloud_functions: ^5.1.5
  firebase_messaging: ^15.2.0
  firebase_database: ^11.1.4
  intl: ^0.20.3
  permission_handler: ^11.3.1
  http: ^1.2.2

  # Supabase (storage via edge function + signed URLs over plain HTTP)
  flutter_dotenv: ^5.2.1

  # Media
  image_picker: ^1.1.2
  photo_manager: ^3.6.0
  camera: ^0.11.0+2
  speech_to_text: ^7.0.0
  gal: ^2.3.1
  flutter_tts: ^4.2.5
  record: ^5.1.2
  audioplayers: ^6.1.0
  video_player: ^2.9.1
  flutter_native_video_trimmer: ^1.1.9
  visibility_detector: ^0.4.0+2
  file_picker: ^8.1.2
  open_filex: ^4.5.0
  path_provider: ^2.1.4

  # Location (GPS + reverse-geocode for onboarding "Nearby")
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.1
  share_plus: ^10.1.2
  sign_in_with_apple: ^7.0.1
  crypto: ^3.0.7
  shared_preferences: ^2.3.2
  package_info_plus: ^8.0.0
  country_state_city: ^0.1.6
  diacritic: ^0.1.6
  image_cropper: ^8.0.2

dependency_overrides:
  # record 5.1.2 transitively pulls record_linux 0.7.2, which is incompatible
  # with record_platform_interface 1.5.0 (missing startStream, changed
  # hasPermission signature). Pinning to 1.x fixes the compile error on iOS.
  record_linux: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

# ─────────────────────────────────────────────
#  Flutter config
# ─────────────────────────────────────────────
flutter:
  uses-material-design: true

  # 📌 Assets — add your images / SVG icons here
  assets:
    - .env
    - assets/img/
    - assets/icons/

