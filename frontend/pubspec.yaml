name: coil
description: Coil — Social community app
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

# ─────────────────────────────────────────────
#  Dependencies
# ─────────────────────────────────────────────
dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.2.0

  # Image caching (better than raw Image.network)
  cached_network_image: ^3.3.1

  # Safe area / device info
  flutter_native_splash: ^2.4.0
  flutter_svg: ^2.2.4

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.2.0
  firebase_database: ^11.1.4
  cloud_functions: ^5.1.5
  agora_rtc_engine: ^6.3.2
  intl: ^0.20.2
  permission_handler: ^11.3.1

  # Media
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

# ─────────────────────────────────────────────
#  Flutter config
# ─────────────────────────────────────────────
flutter:
  uses-material-design: true

  # 📌 Assets — add your images / SVG icons here
  assets:
    - assets/img/
    - assets/icons/

